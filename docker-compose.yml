services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro do compose os serviços se enxergam pelo nome do serviço, não localhost.
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/data:/app/data
      # Cache do modelo do Whisper (Hugging Face) — sem isso, o modelo é
      # baixado de novo da internet toda vez que a imagem é reconstruída
      # (o download em si acontece em tempo de execução, não no build, então
      # não fica na imagem — só persiste aqui, num volume nomeado).
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - redis

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/data:/app/data
      # Mesmo cache do backend acima — é o worker que de fato roda a
      # transcrição (Celery task), então é aqui que o modelo baixado importa.
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # Do ponto de vista do navegador do usuário (fora da rede docker), o
        # backend está em localhost:8000 — por isso não usar o nome do
        # serviço "backend" aqui.
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis_data:
  whisper_cache:
