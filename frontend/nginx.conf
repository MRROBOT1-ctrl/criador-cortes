server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html (não há react-router, mas mantém
    # o comportamento correto se o navegador recarregar em qualquer path).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
